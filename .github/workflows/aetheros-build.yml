
name: AetherOS x86 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AetherOS i386 Debug
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout AetherOS
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          $url = "https://svn.reactos.org/storage/vperevertkin/flexbison.7z"
          Invoke-WebRequest $url -OutFile flexbison.7z
          New-Item -ItemType Directory -Force bin | Out-Null
          7z x flexbison.7z "-obin" -y
          "BISON_PKGDATADIR=$env:GITHUB_WORKSPACE\bin\share\bison" >> $env:GITHUB_ENV
          "M4=$env:GITHUB_WORKSPACE\bin\m4.exe" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE\bin" >> $env:GITHUB_PATH

      - name: Activate MSVC x86 compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
          toolset: '14'

      - name: Configure AetherOS
        shell: pwsh
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=i386 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DENABLE_ROSTESTS=1 `
            -DENABLE_ROSAPPS=1

      - name: Build bootable ISO
        shell: pwsh
        run: cmake --build build --target bootcd --parallel 4

      - name: Verify ISO
        shell: pwsh
        run: |
          if (!(Test-Path "build/bootcd.iso")) {
            throw "AetherOS ISO was not generated"
          }
          Get-Item "build/bootcd.iso" |
            Select-Object Name, Length

      - name: Upload AetherOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-i386-Debug
          path: build/bootcd.iso
          if-no-files-found: error
          retention-days: 14
