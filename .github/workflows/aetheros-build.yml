
name: AetherOS x86 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AetherOS i386 Debug
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout AetherOS
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          ninja --version

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress

          $tools = Get-ChildItem `
            "C:\ProgramData\chocolatey" `
            -Recurse -Filter win_bison.exe |
            Select-Object -First 1

          if (!$tools) {
            throw "win_bison.exe was not found"
          }

          $bin = $tools.Directory.FullName

          Copy-Item "$bin\win_bison.exe" `
            "$bin\bison.exe" -Force

          Copy-Item "$bin\win_flex.exe" `
            "$bin\flex.exe" -Force

          $bin >> $env:GITHUB_PATH

          & "$bin\bison.exe" --version
          & "$bin\flex.exe" --version

      - name: Activate MSVC x86 compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
          toolset: '14'

      - name: Verify build tools
        shell: pwsh
        run: |
          Write-Host "Checking compiler..."
          cl

          Write-Host "Checking CMake..."
          cmake --version

          Write-Host "Checking Ninja..."
          ninja --version

          Write-Host "Checking Bison..."
          bison --version

          Write-Host "Checking Flex..."
          flex --version

      - name: Configure AetherOS
        shell: pwsh
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=i386 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_FLAGS="/wd4005" `
            -DENABLE_ROSTESTS=1 `
            -DENABLE_ROSAPPS=1

      - name: Build bootable ISO
        shell: pwsh
        run: |
          cmake --build build `
            --target bootcd `
            --parallel 4

      - name: Verify ISO
        shell: pwsh
        run: |
          $iso = "build/bootcd.iso"

          if (!(Test-Path $iso)) {
            throw "AetherOS ISO was not generated"
          }

          $file = Get-Item $iso

          Write-Host "AetherOS ISO generated"
          Write-Host "File: $($file.Name)"
          Write-Host "Size: $($file.Length) bytes"

          Get-FileHash $iso -Algorithm SHA256 |
            Format-List

      - name: Upload AetherOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-i386-Debug
          path: build/bootcd.iso
          if-no-files-found: error
          retention-days: 14
